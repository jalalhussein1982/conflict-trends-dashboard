apiVersion: batch/v1
kind: CronJob
metadata:
  name: acled-daily-update
  namespace: conflict-monitor
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              image: siem-ingest:20260406-1
              args: ["daily-update"]
              envFrom:
                - secretRef:
                    name: acled-credentials
                - secretRef:
                    name: siem-db-credentials
                - secretRef:
                    name: siem-app-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
