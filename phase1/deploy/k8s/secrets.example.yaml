apiVersion: v1
kind: Secret
metadata:
  name: acled-credentials
  namespace: conflict-monitor
type: Opaque
stringData:
  ACLED_EMAIL: "researcher@example.com"
  ACLED_PASSWORD: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: siem-db-credentials
  namespace: conflict-monitor
type: Opaque
stringData:
  # Used by the PostgreSQL StatefulSet (container env vars)
  POSTGRES_DB: "siem"
  POSTGRES_USER: "siem_app"
  POSTGRES_PASSWORD: "replace-me"
  # Used by siem-api and siem-ingest (application env vars)
  DB_HOST: "siem-db-rw.conflict-monitor.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "siem"
  DB_USER: "siem_app"
  DB_PASSWORD: "replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: siem-app-credentials
  namespace: conflict-monitor
type: Opaque
stringData:
  JWT_SECRET: "replace-with-64-char-hex"
  MAPBOX_ACCESS_TOKEN: "pk.XXXXXXXXXXXXXXXX"

