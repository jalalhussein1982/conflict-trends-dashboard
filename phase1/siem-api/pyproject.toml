[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-api"
version = "0.1.0"
description = "FastAPI application for the Sahel Information Environment Monitor"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.1,<5",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "PyJWT>=2.9,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

